[project]
name = "cognee-synapse-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cognee>=1.2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
